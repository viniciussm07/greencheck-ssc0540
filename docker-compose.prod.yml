services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: greencheck-db-prod
    environment:
      POSTGRES_DB: greencheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./dados.sql:/docker-entrypoint-initdb.d/2-dados.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Aplicação Flask
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: greencheck-app-prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: greencheck
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_prod:
